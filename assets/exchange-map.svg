<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">MiniModel exchange boundary map</title>
  <desc id="desc">Catalog discovery selects one exact qualified peer route or one explicit pinned-source local conversion, followed by independent verification and atomic activation.</desc>
  <rect width="1100" height="520" fill="#f7f9fb"/>
  <rect x="36" y="36" width="1028" height="448" rx="18" fill="#ffffff" stroke="#c8d2dc" stroke-width="2"/>
  <text x="64" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#16202a">MiniModel acquisition boundary</text>
  <text x="64" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4a5a68">Project sites publish metadata. Model bytes move directly or are converted locally.</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="64" y="160" width="250" height="98" rx="10" fill="#e9f5f2" stroke="#69a596" stroke-width="2"/>
    <text x="88" y="195" font-size="21" font-weight="700" fill="#173c34">Catalog identity</text>
    <text x="88" y="226" font-size="14" fill="#315a51">Source, composition, claims, profiles</text>
    <rect x="64" y="292" width="250" height="98" rx="10" fill="#eef2ff" stroke="#7f93d6" stroke-width="2"/>
    <text x="88" y="327" font-size="21" font-weight="700" fill="#24356f">Exact peer</text>
    <text x="88" y="358" font-size="14" fill="#43507d">Qualified bytes, consent, expiry</text>
    <rect x="64" y="424" width="250" height="38" rx="10" fill="#fff8e6" stroke="#d3a942" stroke-width="2"/>
    <text x="88" y="449" font-size="16" font-weight="700" fill="#6b5013">Pinned public source</text>
    <rect x="426" y="234" width="250" height="126" rx="10" fill="#f1f8ff" stroke="#5996c8" stroke-width="2"/>
    <text x="452" y="272" font-size="21" font-weight="700" fill="#163d5e">Explicit route</text>
    <text x="452" y="302" font-size="14" fill="#345c79">One peer or one local conversion</text>
    <text x="452" y="326" font-size="14" fill="#345c79">No hidden retry or substitution</text>
    <text x="452" y="350" font-size="14" fill="#345c79">Bounded cancellation and evidence</text>
    <rect x="786" y="172" width="250" height="86" rx="10" fill="#f3f7ef" stroke="#88ad5b" stroke-width="2"/>
    <text x="812" y="207" font-size="21" font-weight="700" fill="#314b16">Independent proof</text>
    <text x="812" y="237" font-size="14" fill="#4f6f2f">Members, provenance, qualification</text>
    <rect x="786" y="306" width="250" height="102" rx="10" fill="#fbf0f3" stroke="#c57589" stroke-width="2"/>
    <text x="812" y="342" font-size="21" font-weight="700" fill="#66283b">Atomic activation</text>
    <text x="812" y="372" font-size="14" fill="#7f4052">Exact six-member SLM2</text>
    <text x="812" y="396" font-size="14" fill="#7f4052">Then open in TinyRustLM.com</text>
    <path d="M318 209 L420 282" stroke="#53606d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M318 341 L420 314" stroke="#53606d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M318 443 L420 338" stroke="#53606d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M680 279 L780 220" stroke="#53606d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M680 326 L780 356" stroke="#53606d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#53606d"/>
    </marker>
  </defs>
</svg>
